---
- name: 1.1 Remove old packages (cleanup)
  apt:
    name:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - podman-docker
      - containerd
      - runc
    state: absent
    purge: yes
  ignore_errors: yes

- name: 1.2 Install base packages (ca-certificates, curl, git)
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - git
    state: present
    update_cache: yes

- name: 1.3 Create /etc/apt/keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: 1.4 Download official Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: yes

- name: 1.5 Add official Docker repository
  copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: |
      deb [arch={{ ansible_facts.architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts.distribution_release }} stable
  register: docker_repo_added

- name: 1.6 Update package list
  apt:
    update_cache: yes
  when: docker_repo_added.changed

- name: 1.7 Install Docker CE and plugins
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: 1.8 Start and enable Docker service
  systemd:
    name: docker
    state: started
    enabled: yes

- name: 1.9 Add user to docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes
  when: ansible_user != "root"

- name: 1.10 Test Docker (hello-world)
  docker_container:
    name: hello-world-test
    image: hello-world
    state: started
  ignore_errors: yes

- name: 1.11 Remove test container
  docker_container:
    name: hello-world-test
    state: absent
  ignore_errors: yes

- name: 1.12 Confirm Docker installation
  debug:
    msg: "✅ Docker has been officially installed on {{ ansible_facts.hostname }}"
