<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="الصفحة غير موجودة. تأكد من الرابط أو عد إلى الصفحة الرئيسية لاكتشاف المزيد من الخدمات والحلول التقنية."
    />
    <title>404 - الصفحة غير موجودة | ARKsrv</title>

    <link rel="stylesheet" href="./assets/font-awesome/css/all.min.css">
    <link rel="stylesheet" href="./assets/bootstrap/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="./assets/fonts/cairo.css">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Cairo", sans-serif;
        background: #0f172a;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* خلفية متحركة بنجوم */
      .stars {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }
      .star {
        position: absolute;
        width: 3px;
        height: 3px;
        background: #818cf8;
        border-radius: 50%;
        animation: twinkle 2s infinite alternate;
      }
      @keyframes twinkle {
        0% {
          opacity: 0.2;
          transform: scale(0.8);
        }
        100% {
          opacity: 1;
          transform: scale(1.2);
        }
      }

      .error-wrapper {
        position: relative;
        z-index: 1;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        min-height: 80vh;
      }

      .error-card {
        background: rgba(30, 41, 59, 0.85);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(129, 140, 248, 0.2);
        border-radius: 32px;
        padding: 60px 50px;
        max-width: 700px;
        width: 100%;
        text-align: center;
        position: relative;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        transition: transform 0.4s ease;
      }
      .error-card:hover {
        transform: translateY(-5px);
      }

      .error-card::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle at 30% 50%,
          rgba(129, 140, 248, 0.05) 0%,
          transparent 60%
        );
        pointer-events: none;
      }

      .error-code {
        font-size: 8rem;
        font-weight: 900;
        background: linear-gradient(135deg, #818cf8, #a78bfa, #6366f1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
        margin-bottom: 10px;
        text-shadow: 0 0 60px rgba(129, 140, 248, 0.15);
      }

      .error-icon {
        font-size: 4rem;
        color: #f59e0b;
        display: inline-block;
        animation: float 3s ease-in-out infinite;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-12px);
        }
      }

      .error-title {
        color: #fff;
        font-size: 2rem;
        font-weight: 700;
        margin: 15px 0;
      }

      .error-text {
        color: #94a3b8;
        font-size: 1.1rem;
        line-height: 1.9;
        margin-bottom: 30px;
      }
      .error-text code {
        background: rgba(129, 140, 248, 0.15);
        color: #a78bfa;
        padding: 4px 14px;
        border-radius: 8px;
        font-size: 0.9rem;
        border: 1px solid rgba(129, 140, 248, 0.15);
      }

      .btn-group-404 {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        justify-content: center;
        margin-top: 10px;
      }
      .btn-404-primary {
        background: linear-gradient(135deg, #4f46e5, #6366f1);
        border: none;
        color: #fff;
        padding: 14px 40px;
        border-radius: 60px;
        font-weight: 700;
        font-size: 1rem;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        transition: all 0.3s ease;
        box-shadow: 0 8px 25px rgba(79, 70, 229, 0.3);
      }
      .btn-404-primary:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 35px rgba(79, 70, 229, 0.5);
        color: #fff;
      }
      .btn-404-secondary {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #cbd5e1;
        padding: 14px 35px;
        border-radius: 60px;
        font-weight: 600;
        font-size: 1rem;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        transition: all 0.3s ease;
      }
      .btn-404-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(129, 140, 248, 0.3);
        color: #fff;
      }

      .error-footer-text {
        margin-top: 30px;
        color: #475569;
        font-size: 0.85rem;
        font-family: "Courier New", monospace;
      }
      .error-footer-text i {
        color: #818cf8;
      }

      @media (max-width: 576px) {
        .error-card {
          padding: 40px 25px;
        }
        .error-code {
          font-size: 5rem;
        }
        .error-title {
          font-size: 1.5rem;
        }
        .btn-404-primary,
        .btn-404-secondary {
          padding: 12px 25px;
          font-size: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="stars" id="stars"></div>

    <div class="error-wrapper">
      <div class="error-card">
        <!-- أيقونة عائمة -->
        <div class="error-icon">
          <i class="fa-solid fa-satellite-dish"></i>
        </div>

        <!-- رقم 404 -->
        <div class="error-code">404</div>

        <!-- عنوان -->
        <h1 class="error-title">
          <i
            class="fa-solid fa-triangle-exclamation me-2"
            style="color: #f59e0b; -webkit-text-fill-color: #f59e0b"
          ></i>
          الصفحة المطلوبة غير موجودة
        </h1>

        <!-- نص -->
        <p class="error-text">
          يبدو أن الإشارة فقدت مسارها إلى هذه الصفحة.<br />
          ربما تم نقلها، أو تغير اسمها، أو أنها مجرد
          <code>404 Not Found</code> في السجلات.
        </p>

        <!-- أزرار -->
        <div class="btn-group-404">
          <a href="index.html" class="btn-404-primary">
            <i class="fa-solid fa-house"></i> العودة للرئيسية
          </a>
          <a href="services.html" class="btn-404-secondary">
            <i class="fa-solid fa-list-check"></i> الخدمات
          </a>
          <a href="portfolio.html" class="btn-404-secondary">
            <i class="fa-solid fa-folder-open"></i> الأعمال
          </a>
        </div>

        <!-- سطر أوامر وهمي -->
        <div class="error-footer-text">
          <i class="fa-solid fa-terminal"></i>
          <span style="color: #64748b">admin@arksrv:~$</span>
          <span style="color: #a5f3fc">ping -c 4 arksrv.com</span>
          <span
            style="
              color: #64748b;
              display: block;
              margin-top: 5px;
              font-size: 0.75rem;
            "
          >
            ❌ 4 packets transmitted, 0 received, 100% packet loss
          </span>
        </div>
      </div>
    </div>

    <script src="./assets/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/font-awesome/js/all.min.js"></script>
    <script src="scripts/script.js"></script>
    <script>
      // توليد نجوم عشوائية
      const starsContainer = document.getElementById("stars");
      for (let i = 0; i < 80; i++) {
        const star = document.createElement("div");
        star.className = "star";
        star.style.left = Math.random() * 100 + "%";
        star.style.top = Math.random() * 100 + "%";
        star.style.width = Math.random() * 3 + 1 + "px";
        star.style.height = star.style.width;
        star.style.animationDelay = Math.random() * 3 + "s";
        star.style.animationDuration = Math.random() * 2 + 1.5 + "s";
        starsContainer.appendChild(star);
      }
    </script>
  </body>
</html>
