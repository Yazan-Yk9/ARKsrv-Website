server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html index.php;

    # ==========================================
    # صفحة 404 المخصصة (ستعمل فورًا بهذا الإعداد)
    # ==========================================
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ==========================================
    # الملفات العادية
    # ==========================================
    location / {
        try_files $uri $uri/ =404;
    }

     # ==========================================
    # تحسينات الأداء (ضغط Gzip)
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # ==========================================
    # تخزين مؤقت للملفات الثابتة (Cache)
    # ==========================================
     location ~* \.(css|js|jpg|jpeg|png|gif|ico|woff2|woff|ttf|svg)$ {
         expires 1y;
         add_header Cache-Control "public, immutable";
         # لا نمنع الوصول، فقط نضيف التخزين المؤقت
         try_files $uri =404;
     }
    

    # ==========================================
    # توجيه ملفات PHP إلى حاوية PHP-FPM
    # ==========================================
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass arksrv_php:9000; # الاتصال بحاوية PHP
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
